name: Tests

on:
  workflow_call:
  push:
    branches:
      - main
permissions:
  contents: read

env:
  # "|" falls back to the source repo on any proxy error, including HTTP/2 stream resets mid-download.
  GOPROXY: https://proxy.golang.org|direct
  # Module-relative source paths keep build cache entries independent of the checkout path.
  GOFLAGS: -trimpath
  GOTRACEBACK: all

jobs:
  changes:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: namespace-profile-linux-1cpu
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      groups: ${{ steps.changes.outputs.groups }}
      all: ${{ steps.changes.outputs.all }}
    steps:
      - uses: kenn-io/actions/changes@main
        id: changes
        with:
          filters: |
            go:
              - '!{*.md,docs/**,web/**,packages/**}'
              - '**/*.go'
              - 'docs/screenshots/*.sh'
            embedded-docs:
              # Keep aligned with the go:embed directive in docs/docs.go.
              - 'docs/index.md'
              - 'docs/{get-started,guide,workflows,reference,operations}/*.md'
            frontend:
              - 'web/**'
              - 'packages/**'
              - '.github/**'
              - 'api/openapi.yaml'
              - 'bun.lock'
              - 'package.json'
              - 'Makefile'
              - 'go.mod'
              - 'go.sum'
              - 'mise.toml'
            docs-javascript:
              - 'docs/javascripts/**'
            release-commands:
              - 'README.md'
              - 'scripts/install.sh'
              - 'scripts/install.ps1'
              - '.github/workflows/**'

  release-commands:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'release-commands')) }}
    uses: ./.github/workflows/release-commands.yml

  web-static:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'frontend') || contains(fromJSON(needs.changes.outputs.groups), 'docs-javascript') || contains(fromJSON(needs.changes.outputs.groups), 'embedded-docs')) }}
    name: Web static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1

      - name: Set up Bun
        uses: step-security/setup-bun@v2.1.3
        with:
          bun-version: 1.4.4

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install frozen web dependencies
        run: kit-retry 3 5 make web-install

      - name: Audit web dependencies
        run: kit-retry 3 10 make web-audit

      - name: Run shared UI and web static checks
        run: make web-check web-test

      - name: Upload vitest kata-ui results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-kata-ui-attempt-${{ github.run_attempt }}
          path: packages/kata-ui/test-results/vitest/kata-ui.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload vitest kata-ui-pack results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-kata-ui-pack-attempt-${{ github.run_attempt }}
          path: packages/kata-ui/test-results/vitest/kata-ui-pack.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload vitest web results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vitest-web-attempt-${{ github.run_attempt }}
          path: web/test-results/vitest/web.json
          retention-days: 14
          if-no-files-found: ignore

  web-browser:
    needs: changes
    if: &go-frontend-changes ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'go') || contains(fromJSON(needs.changes.outputs.groups), 'frontend') || contains(fromJSON(needs.changes.outputs.groups), 'embedded-docs')) }}
    name: Web browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1

      - name: Set up Bun
        uses: step-security/setup-bun@v2.1.3
        with:
          bun-version: 1.4.4

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install frozen web dependencies
        run: kit-retry 3 5 make web-install

      - name: Start browser server
        id: browser-server
        timeout-minutes: 10
        working-directory: web
        env:
          # Update the tag and digest together with @playwright/test.
          PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          image_version=${PLAYWRIGHT_IMAGE#*:v}
          image_version=${image_version%%-noble@*}
          if [ "$version" != "$image_version" ]; then
            echo "Installed @playwright/test $version does not match $PLAYWRIGHT_IMAGE. Update the image tag and digest with Playwright." >&2
            exit 1
          fi
          cli=$(node -p "require.resolve('@playwright/test/cli')")
          kit-retry 3 5 docker pull "$PLAYWRIGHT_IMAGE"
          container_id=$(docker run --detach --interactive --init --network host --ipc host \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --workdir "$GITHUB_WORKSPACE/web" \
            "$PLAYWRIGHT_IMAGE" node "$cli" run-server --host 127.0.0.1 --port 3000)
          echo "container_id=$container_id" >> "$GITHUB_OUTPUT"
          for _ in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]; then
              echo 'Browser server container exited before becoming ready.' >&2
              exit 1
            fi
            # workflowretry: allow Poll the local service for readiness.
            if curl --fail --silent --output /dev/null --max-time 2 http://127.0.0.1:3000/json; then
              exit 0
            fi
            sleep 1
          done
          echo 'Browser server did not become ready within 30 attempts.' >&2
          exit 1

      - name: Run isolated browser tests
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
          KATA_HOME: ${{ runner.temp }}/kata-web-browser/home
          KATA_DB: ${{ runner.temp }}/kata-web-browser/home/kata.db
          KATA_WORKSPACE: ${{ runner.temp }}/kata-web-browser/workspace
          KATA_PLAYWRIGHT_SUITE: web-e2e
        run: |
          mkdir -p "$KATA_HOME" "$KATA_WORKSPACE"
          make web-e2e

      - name: Upload playwright web-e2e results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-web-e2e-attempt-${{ github.run_attempt }}
          path: web/test-results/playwright/web-e2e.json
          retention-days: 14
          if-no-files-found: ignore

      # Each Playwright run clears web/test-results, so Firefox runs after the upload above.
      - name: Run isolated Firefox browser tests
        env:
          PW_TEST_CONNECT_WS_ENDPOINT: ws://127.0.0.1:3000/
          KATA_HOME: ${{ runner.temp }}/kata-web-browser/home
          KATA_DB: ${{ runner.temp }}/kata-web-browser/home/kata.db
          KATA_WORKSPACE: ${{ runner.temp }}/kata-web-browser/workspace
          KATA_PLAYWRIGHT_SUITE: web-e2e-firefox
        run: make web-e2e-firefox

      - name: Upload playwright web-e2e-firefox results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-web-e2e-firefox-attempt-${{ github.run_attempt }}
          path: web/test-results/playwright/web-e2e-firefox.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kata-web-browser-failures
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop browser server
        if: always() && steps.browser-server.outputs.container_id != ''
        env:
          CONTAINER_ID: ${{ steps.browser-server.outputs.container_id }}
        run: |
          docker logs "$CONTAINER_ID" || true
          docker stop "$CONTAINER_ID" || true
          docker rm --force "$CONTAINER_ID"

  first-paint:
    name: First paint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1

      - name: Set up Bun
        uses: step-security/setup-bun@v2.1.3
        with:
          bun-version: 1.4.4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install frozen web dependencies
        run: make web-install

      - name: Build kata with the embedded web UI
        run: make build

      - name: Build the docs site
        run: make docs-install docs-build

      # Check the web UI as the daemon serves it.
      - name: Start an isolated daemon
        env:
          KATA_HOME: ${{ runner.temp }}/kata-first-paint/home
          KATA_DB: ${{ runner.temp }}/kata-first-paint/home/kata.db
          KATA_WORKSPACE: ${{ runner.temp }}/kata-first-paint/workspace
        run: |
          mkdir -p "$KATA_HOME" "$KATA_WORKSPACE"
          install -m 600 /dev/null "$KATA_HOME/config.toml"
          printf '[web]\nlisten = "127.0.0.1:7777"\npublic_origin = "http://127.0.0.1:7777"\n' \
            > "$KATA_HOME/config.toml"
          cd "$KATA_WORKSPACE"
          env -u KATA_AUTH_TOKEN "$GITHUB_WORKSPACE/kata" daemon start --foreground \
            > "$RUNNER_TEMP/kata-first-paint/daemon.log" 2>&1 &
          # workflowretry: allow Poll the local daemon for readiness.
          curl --fail --silent --show-error --output /dev/null --retry 60 --retry-delay 1 \
            --retry-all-errors --header 'Accept: text/html' http://127.0.0.1:7777/kata

      # The daemon serves the shell at /kata only to requests that accept HTML,
      # and the check's fetch does not ask for it. /index.html is the same page
      # with the same headers.
      - name: Check first paint
        uses: kenn-io/actions/first-paint@6a8b4227ec7ce3c28c6b042b735781b1601211f4  # main
        with:
          dist: docs/site
          urls: http://127.0.0.1:7777/index.html

      - name: Show the daemon log
        if: failure()
        run: cat "$RUNNER_TEMP/kata-first-paint/daemon.log"

  go:
    needs: changes
    if: *go-frontend-changes
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Go tests is the only writer of the per-commit Linux cache; PostgreSQL jobs restore it.
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Linux Go cache
        id: restore-go-cache
        uses: actions/cache/restore@v6.1.0
        with: &linux-go-cache
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: linux-go-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}
          restore-keys: |
            linux-go-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-

      - name: Track Linux Go cache use
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore-go-cache.outputs.cache-hit != 'true'
        run: |
          cache=$(go env GOCACHE)
          modules=$(go env GOMODCACHE)
          mkdir -p "$cache" "$modules/cache/download"
          echo 'Restored Go cache sizes:'
          du -sh "$cache" "$modules"
          mv "$modules" "$RUNNER_TEMP/go-mod-cache"
          mkdir -p "$modules/cache/download"
          if [ -d "$RUNNER_TEMP/go-mod-cache/cache/download/sumdb" ]; then
            cp -a "$RUNNER_TEMP/go-mod-cache/cache/download/sumdb" "$modules/cache/download/"
          fi
          printf 'GOPROXY=file://%s/go-mod-cache/cache/download|%s\n' "$RUNNER_TEMP" "$GOPROXY" >> "$GITHUB_ENV"
          # Go refreshes entry mtimes at most hourly; age them so every use is recorded.
          find "$cache" -mindepth 2 -maxdepth 2 -path "$cache/[0-9a-f][0-9a-f]/*" \( -name '*-a' -o -name '*-d' \) \
            -exec touch -d '2 hours ago' -- {} +
          touch "$RUNNER_TEMP/go-cache-used-after"

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1

      - name: Set up Bun
        uses: step-security/setup-bun@v2.1.3
        with:
          bun-version: 1.4.4

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install frozen web dependencies
        run: kit-retry 3 5 make web-install

      - name: Check Huma API conventions
        run: |
          huma=go.kenn.io/kit/cmd/huma-check@b1f14b1ca30b680f023dff9467bde0eb70768c68
          kit-retry 3 5 go run -n "$huma"
          go run "$huma" ./...

      - name: Run tests
        env: &go-test-env
          KATA_TEST_FAST_SQLITE: "1"
          KATA_TEST_POSTGRES_AUTO_CONTAINER: "0"
          KATA_SKIP_OPENAPI_CLIENT_CHECK: "1"
        run: >-
          env -u KATA_AUTH_TOKEN
          go tool gotestsum --format pkgname-and-test-fails --format-icons text
          --jsonfile "gotestsum/go.json" --rerun-fails=2
          --rerun-fails-report "gotestsum/go-reruns.txt"
          --packages "$(go list ./... | grep -v '/e2e$')" -- -count=1

      - name: Upload Go test results
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/go-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-go-attempt-${{ github.run_attempt }}
          path: gotestsum/go.json
          retention-days: 14
          if-no-files-found: ignore

      # e2e runs alone because it rebuilds the embedded web assets other packages compile against.
      - name: Run e2e tests
        env: *go-test-env
        run: >-
          env -u KATA_AUTH_TOKEN
          go tool gotestsum --format pkgname-and-test-fails --format-icons text
          --jsonfile "gotestsum/go-e2e.json" --rerun-fails=2
          --rerun-fails-report "gotestsum/go-e2e-reruns.txt"
          --packages ./e2e -- -count=1 -p 1

      - name: Upload e2e test results
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/go-e2e-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-go-e2e-attempt-${{ github.run_attempt }}
          path: gotestsum/go-e2e.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Trim unused Linux Go cache entries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore-go-cache.outputs.cache-hit != 'true'
        run: |
          cache=$(go env GOCACHE)
          modules=$(go env GOMODCACHE)
          echo 'Go cache sizes before trimming:'
          du -sh "$cache" "$modules"
          find "$cache" -mindepth 2 -maxdepth 2 -path "$cache/[0-9a-f][0-9a-f]/*" \( -name '*-a' -o -name '*-d' \) \
            ! -newer "$RUNNER_TEMP/go-cache-used-after" -exec rm -rf -- {} +
          echo 'Go cache sizes after trimming:'
          du -sh "$cache" "$modules"

      - name: Save Linux Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore-go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: linux-go-${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}

  native-agent-plugins:
    needs: changes
    if: &go-changes ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'go') || contains(fromJSON(needs.changes.outputs.groups), 'embedded-docs')) }}
    name: Native agent plugins
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      # Exercise the declared minimum native APIs without running package scripts.
      - name: Install published native APIs
        env:
          KATA_NATIVE_PLUGIN_SDK_ROOT: ${{ runner.temp }}/native-agent-sdk
        run: |
          kit-retry 3 5 npm install --prefix "$KATA_NATIVE_PLUGIN_SDK_ROOT" --ignore-scripts --no-audit --no-fund \
            typescript@7.0.2 @types/node@26.6.4 \
            @earendil-works/pi-coding-agent@0.99.1 \
            @ampcode/plugin@0.0.0-20260526003443-g9106a62 \
            @opencode-ai/plugin@1.0.154 @opencode/plugin@2.0.0 \
            openclaw@2026.9.7

      - name: Run native loaders and SDK checks
        env:
          KATA_NATIVE_PLUGIN_SDK_ROOT: ${{ runner.temp }}/native-agent-sdk
          KATA_PI_TEST_RUNTIME: ${{ runner.temp }}/native-agent-sdk/node_modules/@earendil-works/pi-coding-agent/dist
          KATA_OPENCLAW_TEST_RUNTIME: ${{ runner.temp }}/native-agent-sdk/node_modules/openclaw
        run: >-
          go tool gotestsum --format pkgname-and-test-fails --format-icons text
          --jsonfile "gotestsum/native-agent-plugins.json" --rerun-fails=2
          --rerun-fails-report "gotestsum/native-agent-plugins-reruns.txt"
          --packages ./cmd/kata -- -count=1 -v
          -run '^Test(PiNative(InstalledRunner|RealKataTransport|InstalledRuntimeReplacement)|NativePlugins(Runtime|PublishedDeclarations)|OpenClawPublishedNativeLoader)$'

      - name: Upload native plugin test results
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/native-agent-plugins-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-native-agent-plugins-attempt-${{ github.run_attempt }}
          path: gotestsum/native-agent-plugins.json
          retention-days: 14
          if-no-files-found: ignore

  api-breaking:
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && (needs.changes.result != 'success' || needs.changes.outputs.all == 'true' || contains(fromJSON(needs.changes.outputs.groups), 'go') || contains(fromJSON(needs.changes.outputs.groups), 'embedded-docs')) }}
    name: API and schema history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check for breaking API contract changes
        env:
          BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: make api-breaking BASE_REF="$BASE_REF"

  api-check:
    needs: changes
    if: *go-changes
    name: OpenAPI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Fetch OpenAPI client generator
        run: kit-retry 3 5 go run -n github.com/doordash-oss/oapi-codegen-dd/v3/cmd/oapi-codegen@v3.76.5

      - name: Check generated OpenAPI artifacts
        run: make api-check

  postgres:
    needs: changes
    if: *go-frontend-changes
    name: PostgreSQL ${{ matrix.postgres }} conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: [pg17, pg18]

    services:
      postgres:
        image: pgvector/pgvector:${{ matrix.postgres }}
        env:
          POSTGRES_DB: kata_test
          POSTGRES_USER: kata
          POSTGRES_PASSWORD: kata
          # Test databases are disposable, so keep the data directory in memory.
          PGDATA: /pgdata/data
        ports:
          - 5432:5432
        options: >-
          --tmpfs /pgdata
          --health-cmd "pg_isready -U kata -d kata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Go tests writes this cache.
      - name: Restore Linux Go cache
        uses: actions/cache/restore@v6.1.0
        with: *linux-go-cache

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.1

      - name: Set up Bun
        uses: step-security/setup-bun@v2.1.3
        with:
          bun-version: 1.4.4

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Install frozen web dependencies
        run: kit-retry 3 5 make web-install

      # Service containers cannot take server flags, so turn off durability
      # with ALTER SYSTEM; all three settings apply on reload. TCP skips the
      # socket-only server the image runs during initialization.
      - name: Turn off PostgreSQL durability
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec "$POSTGRES_CONTAINER" psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U kata -d kata_test
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      - name: Run PostgreSQL backend and operator tests
        env: &postgres-test-env
          POSTGRES_MATRIX: ${{ matrix.postgres }}
          KATA_TEST_FAST_SQLITE: "1"
          KATA_TEST_POSTGRES_DSN: postgres://kata:kata@127.0.0.1:5432/kata_test?sslmode=disable
          KATA_SKIP_OPENAPI_CLIENT_CHECK: "1"
        run: >-
          env -u KATA_AUTH_TOKEN
          go tool gotestsum --format pkgname-and-test-fails --format-icons text
          --jsonfile "gotestsum/postgres-$POSTGRES_MATRIX.json" --rerun-fails=2
          --rerun-fails-report "gotestsum/postgres-$POSTGRES_MATRIX-reruns.txt"
          --packages ". ./internal/testenv ./internal/client ./internal/db/pgstore
          ./internal/db/storeopen ./internal/daemon ./internal/mcp ./internal/mcpevents
          ./internal/jsonl ./internal/vector" -- -count=1 -p 4

      - name: Upload PostgreSQL test results
        if: failure() || github.run_attempt > 1 || hashFiles(format('gotestsum/postgres-{0}-reruns.txt', matrix.postgres)) != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-postgres-${{ matrix.postgres }}-attempt-${{ github.run_attempt }}
          path: gotestsum/postgres-${{ matrix.postgres }}.json
          retention-days: 14
          if-no-files-found: ignore

      # cmd/kata PostgreSQL tests carry Postgres in their name.
      - name: Run PostgreSQL CLI tests
        env: *postgres-test-env
        run: >-
          env -u KATA_AUTH_TOKEN
          go tool gotestsum --format pkgname-and-test-fails --format-icons text
          --jsonfile "gotestsum/postgres-$POSTGRES_MATRIX-cli.json" --rerun-fails=2
          --rerun-fails-report "gotestsum/postgres-$POSTGRES_MATRIX-cli-reruns.txt"
          --packages ./cmd/kata -- -count=1 -run Postgres

      - name: Upload PostgreSQL CLI test results
        if: failure() || github.run_attempt > 1 || hashFiles(format('gotestsum/postgres-{0}-cli-reruns.txt', matrix.postgres)) != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-postgres-${{ matrix.postgres }}-cli-attempt-${{ github.run_attempt }}
          path: gotestsum/postgres-${{ matrix.postgres }}-cli.json
          retention-days: 14
          if-no-files-found: ignore

      # e2e runs alone because it rebuilds the embedded web assets other packages compile against.
      - name: Run PostgreSQL e2e tests
        env: *postgres-test-env
        run: >-
          env -u KATA_AUTH_TOKEN
          go tool gotestsum --format pkgname-and-test-fails --format-icons text
          --jsonfile "gotestsum/postgres-$POSTGRES_MATRIX-e2e.json" --rerun-fails=2
          --rerun-fails-report "gotestsum/postgres-$POSTGRES_MATRIX-e2e-reruns.txt"
          --packages ./e2e -- -count=1 -p 1

      - name: Upload PostgreSQL e2e test results
        if: failure() || github.run_attempt > 1 || hashFiles(format('gotestsum/postgres-{0}-e2e-reruns.txt', matrix.postgres)) != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-postgres-${{ matrix.postgres }}-e2e-attempt-${{ github.run_attempt }}
          path: gotestsum/postgres-${{ matrix.postgres }}-e2e.json
          retention-days: 14
          if-no-files-found: ignore

  windows:
    needs: changes
    if: *go-changes
    name: ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # G-S uses measured Windows root-test times. Rebalance if a CLI shard
      # takes longer than the remaining-package leg. Both CLI selectors derive
      # from the single Bash pattern below.
      matrix:
        include:
          - name: Windows
            timeout: 25
            cli: false
          - name: Windows CLI (G-S)
            timeout: 21
            cli: true
            shard: G-S
          - name: Windows CLI (A-F, T-Z, and fuzz/examples)
            timeout: 23
            cli: true
            shard: complement

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Windows Go directories
        shell: pwsh
        run: |
          foreach ($name in @('GOCACHE', 'GOMODCACHE', 'GOTMPDIR', 'TMP', 'TEMP')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            "$name=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ !matrix.cli }}

      # The Windows job is the only writer of the shared Go cache.
      - name: Restore shared Go cache
        id: restore-go-cache
        if: matrix.cli
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ env.GOMODCACHE }}
            ${{ env.GOCACHE }}
          key: setup-go-Windows-x64-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.mod') }}

      - name: Warn on shared Go cache miss
        if: matrix.cli && steps.restore-go-cache.outputs.cache-hit != 'true'
        run: echo "::warning::This CLI shard will rebuild the test binary."

      - name: Build
        if: ${{ !matrix.cli }}
        run: go build ./...

      - name: Run tests
        if: ${{ !matrix.cli }}
        shell: bash
        env:
          KATA_TEST_FAST_SQLITE: "1"
          KATA_SKIP_OPENAPI_CLIENT_CHECK: "1"
        run: |
          cli_package=$(go list ./cmd/kata)
          packages=$(go list ./... | grep -vx "$cli_package")
          env -u KATA_AUTH_TOKEN go tool gotestsum --format pkgname-and-test-fails --format-icons text \
            --jsonfile "gotestsum/windows.json" --rerun-fails=2 \
            --rerun-fails-report "gotestsum/windows-reruns.txt" \
            --packages "$packages" -- -timeout 15m -p 4 -vet=off

      - name: Upload Windows test results
        if: ${{ !matrix.cli && (failure() || github.run_attempt > 1 || hashFiles('gotestsum/windows-reruns.txt') != '') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-windows-attempt-${{ github.run_attempt }}
          path: gotestsum/windows.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Run CLI tests
        if: matrix.cli
        shell: bash
        env:
          KATA_TEST_FAST_SQLITE: "1"
          KATA_SKIP_OPENAPI_CLIENT_CHECK: "1"
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          shard_pattern='^Test[G-S]'
          TEST_RUN="$shard_pattern"
          TEST_SKIP=''
          if [[ "$TEST_SHARD" == complement ]]; then TEST_RUN='.'; TEST_SKIP="$shard_pattern"; fi
          env -u KATA_AUTH_TOKEN go tool gotestsum --format pkgname-and-test-fails --format-icons text \
            --jsonfile "gotestsum/windows-cli-$TEST_SHARD.json" --rerun-fails=2 \
            --rerun-fails-report "gotestsum/windows-cli-$TEST_SHARD-reruns.txt" \
            --packages ./cmd/kata -- -timeout 15m -vet=off -run "$TEST_RUN" -skip "$TEST_SKIP"

      - name: Upload Windows CLI test results
        if: ${{ matrix.cli && (failure() || github.run_attempt > 1 || hashFiles(format('gotestsum/windows-cli-{0}-reruns.txt', matrix.shard)) != '') }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-windows-cli-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: gotestsum/windows-cli-${{ matrix.shard }}.json
          retention-days: 14
          if-no-files-found: ignore

  lint:
    needs: changes
    if: *go-changes
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@v5.2.4
        with:
          # Rebuild older caches so they include mise's signed checksums.
          cache_key_prefix: mise-v2
          cache: true
          install: true

      - uses: kenn-io/kit/.github/actions/kit-retry@v0.47.3

      - name: Locate Go caches
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"

      # Main writes one entry per push; PRs read the newest matching entry.
      - name: Restore lint caches
        id: restore-lint-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            .cache/golangci-lint
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('.custom-gcl.yml', 'go.mod') }}-${{ github.sha }}
          restore-keys: golangci-lint-${{ runner.os }}-${{ hashFiles('.custom-gcl.yml', 'go.mod') }}-

      - name: Fetch Go checkers
        run: GOFLAGS="${GOFLAGS:+$GOFLAGS }-n" kit-retry 3 5 make lint-workflow-retries

      - name: Build custom Go linter
        run: |
          # The key matches .custom-gcl.yml and go.mod; checkout only made them look newer.
          touch -c "$PWD/.cache/golangci-lint/custom-gcl"
          kit-retry 3 5 make "$PWD/.cache/golangci-lint/custom-gcl"

      - name: Run golangci-lint
        run: make lint

      - name: Run golangci-lint for Windows
        env:
          GOOS: windows
        run: make lint

      - name: Vet for Windows
        env:
          GOOS: windows
        run: make vet

      - name: Save lint caches
        if: github.event_name == 'push' && steps.restore-lint-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            .cache/golangci-lint
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ steps.restore-lint-cache.outputs.cache-primary-key }}

