name: Workflow validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".dockerignore"
      - ".goreleaser.yaml"
      - "docker-bake.hcl"
      - "docker/release/**"
      - "cmd/release-artifacts/**"
      - "go.mod"
      - "go.sum"
      - "internal/release/**"
      - "internal/web/**"
      - "packaging/homebrew-core/**"
      - "scripts/release*"
      - "web/**"

permissions:
  contents: read

env:
  # "|" falls back to the source repo on any proxy error, including HTTP/2 stream resets mid-download.
  GOPROXY: https://proxy.golang.org|direct

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          shellcheck: false
          pyflakes: false

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 26.12.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install frozen web dependencies
        run: make web-install

      # `goreleaser check` intentionally exits nonzero for the pinned, deprecated
      # `brews` pipe. Executing the full snapshot validates that pipe and every
      # artifact ID without publishing.
      - name: Validate configuration and build release snapshot
        uses: step-security/goreleaser-action@aee981bee303ff102e9a607e46c6a6ace9201398 # v7.2.2
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean
        env:
          KATA_HOME: ${{ runner.temp }}/kata-release-snapshot/home
          KATA_DB: ${{ runner.temp }}/kata-release-snapshot/home/kata.db
          KATA_WORKSPACE: ${{ runner.temp }}/kata-release-snapshot/workspace

      - name: Retain snapshot release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kata-release-snapshot
          path: |
            dist/
            release-artifacts/
          retention-days: 7

  release-image:
    runs-on: ubuntu-latest
    env:
      VERSION: v0.0.0-snapshot
      OCI_VERSION: 0.0.0-snapshot
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up image emulation
        uses: step-security/setup-qemu-action@d21542abd2ae44772cf2276e75ee4ec531d598b6 # v4.4.0

      - name: Set up image builder
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      # Build the per-platform OCI archive targets that releases publish, then
      # load the native image for the runtime checks.
      - name: Build release image archives
        run: |
          export OCI_OUTPUT_DIR="$RUNNER_TEMP/oci"
          mkdir -p "$OCI_OUTPUT_DIR"
          COMMIT="${GITHUB_SHA::8}" REVISION="$GITHUB_SHA" \
            BUILD_DATE="$(git show -s --format=%cI HEAD)" \
            docker buildx bake "--allow=fs.write=$OCI_OUTPUT_DIR" oci-amd64 oci-arm64 \
            --provenance=mode=min,version=v1 --sbom=true
          test -s "$OCI_OUTPUT_DIR/amd64.oci.tar"
          test -s "$OCI_OUTPUT_DIR/arm64.oci.tar"

      - name: Load the native release image
        run: >-
          docker buildx bake image --load
          --set image.platform=linux/amd64
          --set image.tags=kata-release:snapshot

      - name: Exercise the native release image
        shell: bash
        run: |
          set -euo pipefail
          image=kata-release:snapshot
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = '1000:1000'
          docker run --rm -e KATA_HOME=/data -e KATA_DB=/data/kata.db "$image" version --json
          docker run --rm "$image" _web-assets-check
          data_dir=$(mktemp -d)
          sudo chown 1000:1000 "$data_dir"
          container=""
          trap 'if [ -n "$container" ]; then docker stop "$container"; fi' EXIT
          container=$(docker run -d --rm \
            -v "$data_dir:/data" -p 127.0.0.1::7777 \
            -e KATA_HOME=/data -e KATA_DB=/data/kata.db \
            -e KATA_LISTEN=0.0.0.0:7777 -e KATA_TRUST_PRIVATE_NETWORK=1 \
            -e KATA_WEB_PUBLIC_ORIGIN=http://127.0.0.1:7777 \
            -e KATA_BACKUP_DIR=/data/backups -e KATA_BACKUP_INTERVAL=1s \
            -e KATA_BACKUP_RETAIN=1h "$image")
          port=$(docker port "$container" 7777/tcp)
          # Docker's port proxy accepts and resets connections until the
          # daemon listens; plain --retry does not retry a reset.
          curl --fail --retry 60 --retry-delay 1 --retry-all-errors \
            -H 'Host: 127.0.0.1:7777' "http://$port/api/v1/ping"
          curl --fail -H 'Host: 127.0.0.1:7777' "http://$port/api/v1/health"
          test "$(docker exec "$container" id -u)" = 1000
          test "$(docker exec "$container" stat -c '%a' /data/auth-token)" = 600
          docker exec "$container" test ! -e /data/config.toml
          for ((attempt=0; attempt<30; attempt++)); do
            if [ -n "$(docker exec "$container" find /data/backups -name '*.jsonl' -type f)" ]; then
              break
            fi
            sleep 1
          done
          test -n "$(docker exec "$container" find /data/backups -name '*.jsonl' -type f)"
