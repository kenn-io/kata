name: Released commands

on:
  workflow_call:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-commands:
    name: Released commands
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.sha }}
          persist-credentials: false

      - name: Check commands against the latest release
        uses: kenn-io/actions/release-commands@main
        with:
          files: |
            README.md
            scripts/install.sh
            scripts/install.ps1
          binaries: kata
          asset: kata_*[0-9]_linux_amd64.tar.gz
          repository: kenn-io/kata
