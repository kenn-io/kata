name: Tests

# Run the PR's workflow revision so CI changes are exercised before merge.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'pull_request' && github.ref) || github.run_id }}
  cancel-in-progress: true

permissions: read-all

jobs:
  run:
    uses: ./.github/workflows/test.yml
