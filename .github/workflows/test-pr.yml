name: Tests

# Run the PR's workflow revision so CI changes are exercised before merge.
on:
  pull_request:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  run:
    cache-mode: read
    uses: ./.github/workflows/test.yml

  gate:
    name: CI gate
    needs: run
    if: always()
    runs-on: namespace-profile-linux-1cpu
    steps:
      - env:
          RUN_RESULT: ${{ needs.run.result }}
        run: test "$RUN_RESULT" = success
