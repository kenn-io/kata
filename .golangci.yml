version: "2"
run:
  timeout: 10m
  go: "1.27"
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec
    - modernize
    - kennlint
    - kennnolint
    - nolintlint
    - forbidigo
  settings:
    nolintlint:
      require-specific: true
      allow-unused: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^os\.Rename$'
          msg: Use atomicfile.Replace from go.kenn.io/kit, or atomicfile.RenameNoReplace when the target must not exist, so a Windows reader that opened the target with share-delete can't block the rename.
    custom:
      kennnolint:
        type: module
        description: Require Kit rule labels and reasons in suppression directives.
        original-url: go.kenn.io/kit/lint
      kennlint:
        type: module
        description: Kit's sleep-in-tests and sub-second test deadline analyzers.
        original-url: go.kenn.io/kit/lint
        settings:
          sleeptest:
            eventually: true
          disable:
            - errtext
            - nohttpmux
            - rowserrcheck
            - sqlcheck
            - sqlclosecheck
            - testifyhelper
  exclusions:
    generated: lax
    paths:
      - web/node_modules
    rules:
      - path: pkg/client/generated/generate.go
        linters:
          - revive
        text: "package-comments:"
      - linters:
          - forbidigo
        path: _test\.go
        text: atomicfile\.Replace
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - web/node_modules
