version: "2"
run:
  timeout: 10m
  go: "1.27"
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gosec
    - modernize
    - paralleltest
  settings:
    paralleltest:
      ignore-missing-subtests: true

  exclusions:
    generated: lax
    paths:
      - web/node_modules
    rules:
      - path: pkg/client/generated/generate.go
        linters:
          - revive
        text: "package-comments:"
      - path-except: '^(cmd/kata|internal/tui)/[^/]+_test\.go$'
        linters:
          - paralleltest
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - web/node_modules
