review_guidelines = """
Latest stable Go. Be pragmatic — theoretical findings produce churn.

## Module path

The Go module path is `go.kenn.io/kata`, not `github.com/wesm/kata`.
Imports using `go.kenn.io/kata/...` are correct for this repository.

## Federation CLI is registered

`cmd/kata/main.go` includes `newFederationCmd()` in the root command list,
with implementation in `cmd/kata/federation.go` and lease subcommands in
`cmd/kata/federation_lease.go`. `cmd/kata/main_test.go` pins that registration.
Do not flag public `kata federation ...` docs as advertising an unavailable
command unless those registrations or tests are removed.

## Don't assert external facts you cannot verify

You see only the diff and have no network access. Don't claim a pinned
version, SHA, or URL "doesn't exist". If a maintainer pinned `v2.10.1`
with a SHA, that pin is the source of truth. Flag only concrete
breaking changes visible in the diff. Otherwise phrase as a LOW-severity
question, not a Medium/High "fix".

## Trust model — local daemon plus first-class browser client

Kata is a single-operator tool, not a public multi-tenant service. The default
daemon API uses an owner-local Unix socket on Unix and loopback TCP on Windows.
The default browser listener deliberately follows the established
keyless-loopback convention: same-host processes and users are inside its
ordinary UI trust boundary, but it never grants token administration. Remote
mutable access is opt-in and follows the private-network bearer model described
in AGENTS.md.

Not findings: missing multi-user authorization on owner-local or direct-loopback paths,
`validateActor` "not authorizing" (it is audit metadata), DoS via large bodies
or bulk endpoints on trusted local/private input, symlink following beneath the
owner-only Kata data directory, or races exploitable only by another process
already running as the same OS user.

The browser is a distinct ambient-credential boundary even though it is served
by the daemon. Reviewers MUST enforce all of these invariants:

1. A direct browser tab may create a local-web session only on the keyless local
   trust boundary: direct loopback peer, exact configured loopback Host and
   Origin, no forwarding headers, and no daemon token, identity, or trusted
   proxy authentication. It must be unavailable on non-loopback, proxied, or
   authenticated deployments. The resulting data authority still requires the
   split cookie and tab header in item 2 and never grants token administration.
   `kata ui` opens the advertised loopback URL directly; launch credentials,
   secret runtime siblings, credential fragments, and private browser handoffs
   are not part of the contract. The resulting local-web principal may perform
   ordinary attributed UI writes but must never gain token administration.
2. Every authenticated browser data request requires both the instance-scoped
   HttpOnly cookie and `X-Kata-Web-Session`; mutation requests additionally
   require matching `X-Kata-CSRF` and same-origin validation. Cookie-only,
   header-only, or CSRF-only authorization is a HIGH finding. The cookie is one
   manager-scoped ambient value shared by tabs; session and CSRF values are
   tab-local. Issuing or logging out one tab must not rotate/delete the ambient
   cookie or invalidate another tab's header session.
3. Database-token-backed sessions must fail after token revocation and all
   sessions have a bounded lifetime. Do flag cached browser authority that can
   outlive its backing token or the documented session lifetime. Long-lived SSE
   streams revalidate browser authority before every event, reset, and heartbeat;
   handshake-only authentication is insufficient. Authenticated API responses
   are private and non-cacheable and vary on both the cookie and
   `X-Kata-Web-Session`; do flag responses a shared proxy could replay across
   browser principals. Browser authentication and credentialed API fetches use
   redirect mode `error`; following redirects with tokens, cookies, or
   session headers is a credential-boundary defect.
4. Exact Host validation is the DNS-rebinding boundary and runs before browser
   session or route handling. Dedicated browser listeners enforce it for every
   request. Shared TCP listeners enforce an allowlist of the configured public
   authority, concrete backend authority, and exact `[web].allowed_hosts`
   authorities for every request, including unmarked ordinary API reads.
   `allowed_hosts` exists for explicitly configured container/proxy/backend
   aliases; it is never inferred from forwarded headers. Foreign DNS Host
   values are never made safe by classifying traffic as CLI or presenting a
   bearer header. Browser-bearing mutations require the exact configured
   Origin even when the header would otherwise be absent, while ordinary
   health, CLI, and federation requests remain governed by daemon
   bearer/private-network auth. Bearer CLI
   event streams remain CLI traffic.
5. HTTP browser origins are accepted for loopback. Non-loopback HTTP requires
   explicit `[auth].trust_private_network = true` and represents an
   operator-trusted private overlay; otherwise the public origin must be HTTPS.
   Do not flag trusted-overlay plaintext solely because a hostname is used. Do
   flag non-loopback HTTP without that opt-in, public unauthenticated defaults,
   cross-origin redirects, or secrets sent to a different origin.
   Configured-remote UI login must apply the same bearer-target validation
   before opening a page that accepts a daemon token.
6. `web.public_origin` is the configured canonical browser authority, with
   default HTTP/HTTPS ports removed to match browser `Host` and `Origin`
   serialization, and is never derived from forwarded headers. Root-relative
   routes are the supported deployment; path-prefixed public or daemon URLs
   must be rejected rather than partially supported. Development launchers and
   fixtures must construct child environments from an explicit OS/toolchain
   allowlist before applying temporary isolated paths; database, daemon,
   workspace, config, credential, proxy, and hosted-port targets are not
   inherited before branch code is built, seeded, or started. On Windows the
   launcher must bind the shared daemon listener to its selected temporary
   backend port.
7. `--insecure-readonly` may expose anonymous snapshots and polling, but must
   never authorize mutations, token administration, or writable sessions.
   `kata ui` opens its validated origin directly when the runtime advertises
   readonly. Cookie-only ambient state is ignored
   in this mode; a session header still opts into split browser authentication.
8. Browser capabilities are principal-derived. In identity mode the bootstrap
   login remains unable to perform attributed writes; a direct local session or
   writable identity token must back a writable snapshot. A 401 clears tab-local
   credentials and fences accepted snapshots and drafts from further writes.
   Keyless loopback may attempt one transparent local-session renewal;
   authenticated deployments return to token login. Explicit login does not read snapshot authority before token
   exchange. Every mutation path, including project creation, must use this
   rejection behavior. Mutation controls stay disabled for stale or read-only
   authority and while any mutation is pending; do not allow project creation
   to overlap the shared mutation state.
9. The configured-daemon gateway is a server-side credential broker, not an
   authority upgrade. Catalog targets and their tokens are operator-trusted,
   but target tokens never enter the browser and may exercise only the source
   principal's ordinary SPA authority. Non-writable source principals cannot
   mutate targets; advertised capabilities are intersected with source policy;
   and anonymous read-only clients cannot use credentialed targets. The local-
   web SPA allowlist excludes token administration, federation, integrations,
   purge operations, and daemon-owner filesystem or alias initialization.
   Outbound proxy headers use an explicit API allowlist and exclude browser
   credentials, forwarding headers, and every trusted-proxy actor assertion.
   Targets must be canonical root HTTP(S) origins, credentials remain pinned to
   that origin, and redirects are rejected. Proxied SSE is intentionally
   disabled until source sessions can be revalidated before every event, reset,
   and heartbeat. Identity-bound source principals are read-only across remote
   gateway hops because no delegated-identity protocol exists; request-actor
   sources are writable only when the target advertises the same actor policy.
   Every remote mutation rechecks the exact target origin and credential's live
   writable and actor-policy capabilities through the projection-free instance
   response before forwarding.
   Remote workspaces poll instead. Valid findings include source-
   policy escalation, target-token or actor-header misrouting, anonymous-readonly
   bypass, cross-origin credential redirects, and streams surviving source
   revocation. Missing multi-tenant ACLs between principals already trusted for
   one configured daemon are not findings by themselves.
10. The production CSP keeps scripts same-origin-only. Kata's dynamic layout
   requires inline style attributes, so `style-src-attr 'unsafe-inline'` is an
   intentional narrow allowance and must not be broadened to inline scripts.

Snapshot responses are backend-consistency contracts: a matching ETag performs
no projection reads, a built snapshot captures its cursor inside the same
consistent read, filters apply before limits, recurrences remain project
scoped, archived-project endpoints do not appear through relationship or link
projections, every visible mutation (including project merge) durably advances
the cursor, and SQLite/PostgreSQL behavior stays in parity. A
`sync.reset_required` frame stays latched until an unconditional snapshot
returns `200`; failure retries may not accept a conditional `304` or restore
writable stale authority. Project catalog mutations, including
config-reconciled federation replica creation, host-service project creation,
and recurrence CRUD, broadcast their exact transaction event to live clients
and enqueue it for mutation hooks; post-commit event scans are not an
acceptable substitute. Deliver the event before response-only reads or
credential persistence can fail. A project-init failure after commit delivers
the event when state remains, while successful orphan cleanup broadcasts the
reset cursor reserved by that cleanup transaction. Recurrence deletion requires
`If-Match` and checks the visible revision atomically in the deletion
transaction. User-initiated project events retain their attributed actor, while
`system` is reserved for internal project mutations. Treat project and
recurrence events as hook-eligible for both exact and `*` subscriptions. Treat
violations as functional data-isolation defects rather than optional hardening.

## Release review posture

Versioned CLI releases intentionally start with checksum verification only:
release archives and Linux packages are published with one aggregate
`SHA256SUMS`, and `kata update` uses kit's checksum-only mode for this first
release line. Signed update metadata is future work. Do not raise a blocking
finding solely because release assets use `SHA256SUMS` without detached
signatures. Valid findings remain: skipped checksum verification in the
installer or updater, asset names that no longer match kit's default
self-update contract, missing assets in a successful release, or code/docs
that claim signed updates exist before signing is implemented.

Semver tag pushes are the release publication mechanism. A repository writer
who can push a semver release tag to a commit already contained in `origin/main`
is trusted to initiate the GitHub release and GoReleaser artifact upload through
the tag-triggered Release workflow. Do not raise a blocking finding merely
because the tag-triggered release job has `contents: write`, lacks an additional
`release` environment approval, or publishes with `GITHUB_TOKEN`.

The release workflow must still validate the tag shape, verify the tag target is
contained in `origin/main`, run that validation without release-write
permissions and from trusted default-branch code, check out the immutable
validated commit SHA for packaging, and re-check the tag immediately before
creating the GitHub release. Valid findings remain: shell injection in tag
handling, publishing from non-semver tags, publishing a tag whose target is not
in `origin/main`, running validation from tag-controlled code before containment
is proven, checking out a mutable ref for packaging after validation, skipping
the immediate pre-publish tag re-check, or broadening write credentials beyond
the release publication job.

Every GoReleaser entry point runs `make web-release-check` and must provision
the pinned Node/Bun toolchain plus frozen web dependencies before creating or
uploading a release. Missing those prerequisites is a valid release-blocking
finding.

Stronger release provenance such as GPG tag verification, artifact signing, or
SLSA-style attestations is future hardening work. Do not block current release
changes solely because those mechanisms are absent unless the diff claims they
already exist or weakens an existing verification step.

The Publish Release workflow may create the GitHub release before GoReleaser
finishes uploading artifacts. A visible release during an in-progress or failed
GoReleaser run is an operational cleanup issue, not a supply-chain
vulnerability. It is valid to flag a successful publish run that leaves the
release without the expected archives, packages, or `SHA256SUMS`.

## Tailscale/private-overlay hostnames

Kata intentionally supports private-network daemon access over operator-
trusted plaintext. A configured `allow_insecure = true` daemon target, or
`KATA_ALLOW_INSECURE=1` for `KATA_SERVER`, means the operator explicitly
accepted HTTP for a trusted private overlay such as Tailscale. Do not raise a
Medium/High finding merely because a token-bearing `http://hostname:port`
request uses DNS or plaintext; Tailscale, MagicDNS, mDNS, and similar
private-overlay hostnames are expected deployment shapes, not evidence of a
public-network leak.

Do not recommend DNS-resolution preflights that reject hostnames unless the
diff is explicitly changing a literal-IP-only mode. Overlay hostnames can be
the stable operator-facing identity while their addresses change underneath.

Valid findings remain: bearer tokens sent to a different origin than the
configured daemon, redirects that can receive tokens cross-origin, plaintext
hostname access without an explicit `allow_insecure` opt-in, secrets logged or
rendered in errors, a config/default that exposes bearer HTTP publicly by
default, or a code path that claims to support `allow_insecure` but silently
ignores it.

## Schema upgrades use JSONL cutover, not ALTER-TABLE migrations

Schema lives in the embedded `internal/db/schema.sql`. There is no
migrations directory; `db.Open` returns `ErrSchemaCutoverRequired`
when versions mismatch, and `jsonl.AutoCutover` rebuilds the DB from
JSONL into a fresh current-schema bootstrap.

Bumping the version: edit `schema.sql`. For shape changes (added /
removed / retyped columns), add a version-aware exporter for the old
shape in `internal/jsonl/export.go` and make the importer tolerant of
the missing field. For CHECK widenings, no exporter is needed — old
rows still satisfy the wider constraint after the rebuild.

Don't flag "missing migration file" or "the existing DB keeps the old
CHECK". No DDL script would run, and every old DB is torn down and
rebuilt by JSONL cutover.

## Pre-transaction close guards: accepted v1 trade-off

`CheckSiblingCloseThrottle` and `CheckRepeatedMessageGuard` in
`internal/daemon/close_guards.go` read before `db.CloseIssue`'s write
tx, so concurrent closes can momentarily exceed the limit by one. The
spec documents this (anti-agent-justification §3.9); agents are
typically serial and the next close in the window still trips the
guard and emits `close.throttled`. Don't re-raise — if a real attack
path exists, name it concretely.

## TUI close bypass: intentional trust-on-claim, scoped to reason=done

`internal/daemon/handlers_actions.go` skips substance/evidence
validation only when `source == "tui"` AND `reason == "done"` (the
only shape the interactive close keystroke produces). A TUI claim
with any other reason still runs full validation, including
duplicate-of / superseded-by target checks. Forging the source field
on a `done` close costs the same as forging evidence — adding a
server-issued capability only inconveniences honest callers. Audit
still flags `no-evidence` closes; structural guards still run. Don't
recommend a separate endpoint or capability token; if you find a
check that should run for TUI but doesn't, raise *that* check.

## Project archival

`projects.deleted_at != NULL` = archived. Surface reads filter at the
query (`ListProjects`, `ListAllIssues`); callers needing archived rows
use `*IncludingArchived` variants. `ProjectByID` returns archived rows
on purpose so merge / restore can see them. Verify the actual query
before flagging `ProjectByID` or claiming `ListAllIssues` leaks
archived data.
"""
